services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: ${DB_USER:-weather}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}   # local-only placeholder default
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-weather} -d weather"]
      interval: 5s
      timeout: 3s
      retries: 10
  service-ingestion:
    build:
      context: .
      dockerfile: service-ingestion/Dockerfile
    environment:
      - DB_URL=jdbc:postgresql://db:5432/weather
      - DB_USER=${DB_USER:-weather}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
    ports: ["8081:8081"]
    depends_on:
      db: 
        condition: service_healthy
  service-query:
    build:
      context: .
      dockerfile: service-query/Dockerfile
    environment:
      - DB_URL=jdbc:postgresql://db:5432/weather
      - DB_USER=${DB_USER:-weather}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
    ports: ["8082:8082"]
    depends_on:
      db:
        condition: service_healthy
